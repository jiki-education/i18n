# The gate on every change to locales/.
#
# CI never stamps. Stamping needs --stamp and belongs to a translation pass,
# beside the writing, one item at a time. A stamp asserts a translation matches
# its English, and nothing automated should be able to make that claim. A PR that
# edited a translation without re-stamping fails here, which is the point.
#
# ## Which English this validates against
#
# This repo holds no English. It is checked out from the front-end, and WHICH
# commit depends on where the run is:
#
#   - on a PR, the commit the branch pins with an `English-Ref:` commit trailer,
#     written by the orchestrator that produced the translations. The branch
#     validates against fixed English, so it cannot go red because something
#     merged next door while it was open.
#   - on main, front-end main. This floats, knowingly. Publish records the SHA it
#     used, so attribution survives the float.
#
# Both runs below, the branch's and its baseline's, read that ONE checkout. See
# "Both runs read the same English" in scripts/validate.mjs for why differencing
# two runs against two different Englishes would attribute to the branch every
# item whose English moved between the pins.
#
# ## What this gates on
#
# The errors the BRANCH INTRODUCES, not the absolute count. `--baseline-ref` runs
# the same checks over the content at the merge base and fails only on the
# difference. The absolute count is still printed, and pre-existing errors are
# still listed in full; they just do not fail the run.
#
# Without that, this job is red on every PR forever. Translation is dispatched at a
# front-end PR's head, deliberately ahead of English merging, so for the whole
# review window of any curriculum PR this repo holds translations of English that
# is not on front-end main, and each one reads as `stale:` or `missing key:` here.
# That was 884 errors in production locales when this was written, none of them
# anybody's PR, and it made three open PRs that touch nothing but `scripts/` red.
# A check that is always red is not a check: it stops being read, and the first
# real regression lands underneath the noise. Same reasoning that took this job off
# pushes to main.
#
# See ENGLISH-SOURCE.md.

name: Validate

# Pull requests only. On main this compared translations against whatever English
# front-end main had at that moment, which for a corpus translated earlier is a
# report of the backlog rather than a defect: it went red and stayed red, and a
# check that is always red stops being read. What each locale is missing is
# published in completeness.json, which is the honest home for that number.
on:
  pull_request:
    paths:
      - "locales/**"
      - "scripts/**"
      - "locales.json"
      - "corpus.json"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # The real branch head, not the merge commit: the pin is read from the
      # commits between the merge base and the head, and a merge commit already
      # contains the base.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # Before setup-node, so its pnpm cache has a pnpm to ask for a store path.
      # The version comes from package.json's `packageManager` field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Prints the pinned SHA, or "main" when this branch pins nothing, which is
      # every push to main and every PR that is not translation work.
      - name: Which English
        id: english
        run: |
          BASE=""
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags --quiet origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            BASE="origin/${{ github.base_ref }}"
          fi
          REF=$(node scripts/source-checkout.mjs --resolve --base="$BASE")
          echo "English: $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      # Sparse and shallow: English is five directories of a large monorepo, and
      # this runs on every PR.
      #
      # `content/images` is in the sparse list even though this repo publishes no
      # image bytes, because the publish dry run below renders every translated
      # post, and rendering one resolves each `/images/...` reference against the
      # source repo to prove English uses that image too
      # (scripts/lib/prose.mjs). Without the directory checked out, that
      # resolution cannot tell "English does not have this image" from "this
      # checkout did not fetch it", and it reports the former.
      - name: Check out English
        uses: actions/checkout@v4
        with:
          repository: jiki-education/front-end
          ref: ${{ steps.english.outputs.ref }}
          path: .source/front-end
          sparse-checkout: |
            app/messages
            curriculum/src
            interpreters/src
            content/src
            content/images

      # Subtitles are the one content type whose English is not the front-end's:
      # they are cut from the rendered video and authored beside it (SOURCE_REPOS
      # in scripts/lib/english.mjs). That repo is private, so this job does not
      # check it out and validate skips the subtitle type with a `skip:` line
      # rather than failing. Locally, `npm run source:checkout -- --source=videos`
      # brings it into scope and the checks run in full.

      # Two bodies of user-facing copy are still translated in the api repo
      # rather than here, so the coverage step reads them there to report a whole
      # language. Always main: that copy has no pin, and a branch of it would
      # report copy that does not exist yet. `continue-on-error` because coverage
      # gates nothing and must never become the thing that fails a PR; without
      # this checkout it prints api rows saying it could not read one.
      - name: Check out api copy
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: jiki-education/api
          ref: main
          path: .source/api
          sparse-checkout: |
            config/locales
            config/initializers
            db/seeds

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: node scripts/test.mjs

      # `fetch-depth: 0` above is what makes the merge base findable; the "Which
      # English" step has already fetched the base branch to read the pin from it.
      # The baseline run happens inside validate, over a detached worktree of the
      # merge base with this branch's own scripts/ copied in, so both runs apply
      # one set of checks to two trees.
      - name: Validate every locale
        run: node scripts/validate.mjs all --baseline-ref="origin/${{ github.base_ref }}"

      # Builds every artifact and re-runs the R2 key guard over the finished
      # tree, without uploading anything.
      - name: Publish dry run
        run: node scripts/publish.mjs all

      - name: Coverage
        if: always()
        run: node scripts/coverage.mjs
