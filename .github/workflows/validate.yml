# The gate on every change to locales/.
#
# Runs with --no-stamp, so a PR cannot pass by stamping itself: the stamp is
# written by a translate run, and CI only ever verifies it. A PR that edited a
# translation without re-stamping fails here, which is the point.

name: Validate

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "locales/**"
      - "scripts/**"
      - "locales.json"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The mirror must still be a mirror. A PR that hand-edited locales/source/
      # fails here rather than silently becoming a second home for English.
      - name: Source mirror is unmodified
        run: node scripts/sync-source.mjs --check

      - name: Validate every locale
        run: node scripts/validate.mjs all --no-stamp

      # Builds every artifact and re-runs the English-prefix guard over the
      # finished tree, without uploading anything.
      - name: Publish dry run
        run: node scripts/publish.mjs all --allow-partial --allow-incomplete

      - name: Coverage
        if: always()
        run: node scripts/coverage.mjs
