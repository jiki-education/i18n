# The gate on every change to locales/.
#
# Runs with --no-stamp, so a PR cannot pass by stamping itself: the stamp is
# written by a translate run, and CI only ever verifies it. A PR that edited a
# translation without re-stamping fails here, which is the point.

name: Validate

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "locales/**"
      - "scripts/**"
      - "locales.json"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Only prose publishing has dependencies: it renders Markdown through the
      # same package the front-end uses, so the HTML matches byte for byte. The
      # rest of scripts/ is dependency-free and would run without this.
      - name: Install
        run: npm ci

      # The merge and hashing rules the published artifacts depend on. These run
      # first because a break here invalidates every artifact the later steps
      # build, and they need no corpus to be meaningful.
      - name: Unit tests
        run: node scripts/test.mjs

      # The mirror must still be a mirror. A PR that hand-edited locales/source/
      # fails here rather than silently becoming a second home for English.
      # Reads only the manifest hashes, so it needs no front-end checkout.
      - name: Source mirror is unmodified
        run: node scripts/sync-source.mjs --check

      - name: Validate every locale
        run: node scripts/validate.mjs all --no-stamp

      # Builds every artifact and re-runs the English-prefix guard over the
      # finished tree, without uploading anything.
      - name: Publish dry run
        run: node scripts/publish.mjs all

      - name: Coverage
        if: always()
        run: node scripts/coverage.mjs
