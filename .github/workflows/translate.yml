# Dispatch-receive → check out English → translate → validate → branch → PR.
#
# The front-end fires a `repository_dispatch` when English changes. It sends
# coordinates, never content: `en.json` alone is 94KB and a repository_dispatch
# payload is capped well below that, so this checks out the SHA it was told about
# and reads English from there.
#
# Payload contract (client_payload):
#   repo      string   the source repo, e.g. "jiki-education/front-end"
#   sha       string   the commit to read English from
#   pr        number   the front-end PR that landed it
#   packages  string[] which packages changed: app | curriculum | interpreters | content
#   mode      string   outdated | all | missing, passed straight to translate
#
# `all` is what the front-end sends after a glossary or guide change, because
# those do not touch English and so are invisible to the staleness stamps.
#
# ## The branch, and the ref that pins it
#
# This opens a PR rather than pushing to main, and writes `.english-refs/<pr>.json`
# in the SAME COMMIT as the work, so the branch and the English it was made
# against can never disagree. One file per front-end PR, so two translation
# branches open at once never touch the same file. See ENGLISH-SOURCE.md.
#
# This workflow never uploads. Merging the PR is what publishes (see publish.yml).

name: Translate

on:
  repository_dispatch:
    types: [source-changed]
  workflow_dispatch:
    inputs:
      sha:
        description: "front-end SHA to read English from (default: main)"
        required: false
        default: main
      pr:
        description: "front-end PR number this is for (blank for a manual run)"
        required: false
      mode:
        description: outdated | all | missing
        required: false
        default: outdated
      locales:
        description: comma-separated target locales, or "all"
        required: false
        default: all

concurrency:
  # One translate run at a time. Two concurrent runs would race on the same
  # locales/<locale>/ files and the survivor's wording would be whichever
  # finished last, which is the same contention the translator repo avoids by
  # allowing exactly one writer per (family, language).
  group: translate
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Check out English at the dispatched SHA
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repo || 'jiki-education/front-end' }}
          ref: ${{ github.event.client_payload.sha || inputs.sha || 'main' }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: .source/front-end
          sparse-checkout: |
            app/messages
            curriculum/src
            interpreters/src
            content/src

      - name: Check out the translator repo
        uses: actions/checkout@v4
        with:
          repository: jiki-education/translator
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: .source/translator

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # A dispatch may name a branch; the ref file must name a commit, because a
      # branch name pins nothing. Resolve it from the checkout that just happened,
      # which is by definition the English this run reads.
      - name: Resolve what was checked out
        id: english
        run: |
          echo "sha=$(git -C .source/front-end rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          PR="${{ github.event.client_payload.pr || inputs.pr }}"
          echo "id=${PR:-manual-${{ github.run_id }}}" >> "$GITHUB_OUTPUT"

      - name: Stub new keys across every locale
        run: node scripts/stub.mjs all

      - name: Translate
        env:
          JIKI_TRANSLATOR_REPO: .source/translator
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node scripts/translate.mjs "${{ github.event.client_payload.locales || inputs.locales || 'all' }}" \
            --mode="${{ github.event.client_payload.mode || inputs.mode || 'outdated' }}"

      # translate already runs this, but re-running with --no-stamp proves the
      # committed state passes on its own rather than only as a side effect.
      - name: Validate
        run: node scripts/validate.mjs all --no-stamp

      - name: Branch, record the English ref, and open a PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="translate/${{ steps.english.outputs.id }}"
          git config user.name "jiki-i18n[bot]"
          git config user.email "i18n@jiki.io"
          git checkout -b "$BRANCH"

          node scripts/english-ref.mjs write \
            --pr="${{ steps.english.outputs.id }}" \
            --sha="${{ steps.english.outputs.sha }}" \
            --repo="${{ github.event.client_payload.repo || 'jiki-education/front-end' }}"

          git add locales .english-refs
          if git diff --cached --quiet; then
            echo "Nothing to translate."
            exit 0
          fi

          git commit -m "Translate: ${{ github.event.client_payload.repo || 'front-end' }}@${{ steps.english.outputs.sha }}

          English ref: .english-refs/${{ steps.english.outputs.id }}.json
          Mode: ${{ github.event.client_payload.mode || inputs.mode || 'outdated' }}."
          git push --force-with-lease --set-upstream origin "$BRANCH"

          gh pr create --fill --head "$BRANCH" --base main || gh pr edit "$BRANCH" --add-label translation

      - name: Coverage report
        if: always()
        run: node scripts/coverage.mjs
