# The only thing that writes to R2.
#
# Every route into this repo ends at a commit on main: a translation pass commits
# there, a human merges a PR there. So publishing on push to main means there is
# exactly one publish path, and everything that reaches the bucket has been
# through validate first.
#
# Nothing is ever published partially. A locale carrying sentinels, or an artifact
# assembled from a corpus this repo holds only a slice of, is skipped and logged.
# publish.mjs owns that rule and offers no flag to loosen it, so it cannot be
# loosened by how this workflow invokes it.
#
# A run that finds nothing shippable succeeds. Most merges are translation work in
# progress, and a red main on every one of them would train everybody to ignore it.

name: Publish

on:
  push:
    branches: [main]
    paths:
      - "locales/**"
      - "scripts/**"
      - "locales.json"
      - "corpus.json"
      - ".github/workflows/publish.yml"

# Artifacts are immutable and content-hashed, so two runs uploading the same bytes
# is harmless. Pointers are not: they are the one mutable object, and two runs
# flipping them in either order could leave a pointer naming an older artifact than
# the commit that ran last. Serialise, and never cancel a run mid-upload.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # main reads front-end main. This floats, knowingly: the alternative is a
      # pin that nothing updates, which would quietly publish English that is
      # months old. The SHA used is stamped into completeness.json below, so
      # "which English was this" stays answerable after the fact.
      #
      # `content/images` is in the sparse list even though this repo publishes no
      # image bytes, because rendering a translated post resolves every
      # `/images/...` reference against the source repo to prove English uses that
      # image too (scripts/lib/prose.mjs). Without the directory checked out, that
      # resolution cannot tell "English does not have this image" from "this
      # checkout did not fetch it", and it reports the former.
      - name: Check out English
        uses: actions/checkout@v4
        with:
          repository: jiki-education/front-end
          ref: main
          path: .source/front-end
          sparse-checkout: |
            app/messages
            curriculum/src
            interpreters/src
            content/src
            content/images

      # Subtitles are the one content type whose English is not the front-end's:
      # they are cut from the rendered video and authored beside it (SOURCE_REPOS
      # in scripts/lib/english.mjs). That repo is private, so this job does not
      # check it out, exactly as validate.yml does not: the validate step below
      # prints a `skip: video-subtitles` line rather than failing, and publish
      # itself never reads it at all, because subtitles are served by Mux and
      # their content type carries `r2: null`, so there is no artifact to build.
      #
      # It used to be checked out here, and when that checkout began failing it
      # took the whole publish with it: one unreachable optional source stopped
      # every locale's every type from reaching R2. A source no step in this job
      # reads has no business being able to fail it.

      # Before setup-node, so its pnpm cache has a pnpm to ask for a store path.
      # The version comes from package.json's `packageManager` field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Only prose publishing has dependencies: it renders Markdown through the
      # same package the front-end uses, so the HTML matches byte for byte. The
      # rest of scripts/ is dependency-free and would run without this.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Reported, never enforced. Publishing is deliberately permissive: work in
      # progress has to reach R2 or nobody can review it on staging, and a locale
      # being behind is the normal state rather than a fault. What a locale is
      # missing is recorded in completeness.json, and the front-end's deploy is
      # where that record actually blocks anything.
      #
      # Enforcing here would mean one stale item stops every locale publishing,
      # including the ones that are fine.
      - name: Validate (report only)
        continue-on-error: true
        run: node scripts/validate.mjs all

      # Builds every artifact plus the pointer beside it, then uploads: artifacts
      # first, pointers second, so a pointer never names an object that is not
      # there yet. dist/ is rebuilt from the tree, never committed.
      - name: Publish
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/publish.mjs all --upload

      - name: Coverage
        if: always()
        run: node scripts/coverage.mjs
